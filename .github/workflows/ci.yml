name: Cartouche Fast Diff-Aware CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

# Lesson 3 from Rezono: immediately cancel superseded PR runs to save runners!
concurrency:
  group: cartouche-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      core: ${{ steps.filter.outputs.core }}
      scene: ${{ steps.filter.outputs.scene }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "merge_group" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "core=true" >> "$GITHUB_OUTPUT"
            echo "scene=true" >> "$GITHUB_OUTPUT"
            echo "ui=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only HEAD~1 HEAD || true)
          echo "$CHANGED" | grep -qE '^(packages/reader-core|contracts|fixtures|scripts)/' && echo "core=true" >> "$GITHUB_OUTPUT" || echo "core=false" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" | grep -qE '^(packages/scene-ir|packages/reader-core|contracts|fixtures)/' && echo "scene=true" >> "$GITHUB_OUTPUT" || echo "scene=false" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" | grep -qE '^(packages/slip|packages/atlas|decisions)/' && echo "ui=true" >> "$GITHUB_OUTPUT" || echo "ui=false" >> "$GITHUB_OUTPUT"

  # Ultra-lightweight universal gate (runs in ~12s on 1 runner, zero backend needed!)
  fast-guards-and-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Run complete fast-check (tsc + AST zero-compute lint + contract freeze + tests)
        run: npm run fast-check
        env:
          CARTOUCHE_PRIVATE_PATTERNS: ${{ secrets.CARTOUCHE_PRIVATE_PATTERNS }}

  # Visual / 3D verification ONLY runs when UI/Scene actually changes (never blocks core PRs!)
  scene-and-specimen:
    needs: [detect-changes, fast-guards-and-green]
    if: needs.detect-changes.outputs.scene == 'true' || needs.detect-changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify geometric invariants, Svelte DOM/WCAG smoke & red-board integrity
        run: |
          node --experimental-strip-types --no-warnings --test tests/green/geometry-invariants.test.mjs tests/green/xd-discipline-guard.test.mjs tests/green/svelte-dom-a11y-smoke.test.mjs
          npm run red-board -- --json > /dev/null
