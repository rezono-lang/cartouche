name: PR Red-Test & Frozen-Contract Policy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: cartouche-red-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  red-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Pass cleanly inside merge_group (enforced at PR gate)
        if: github.event_name == 'merge_group'
        run: |
          echo "merge_group: PR red-policy already enforced on pull_request."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name == 'pull_request'
        with:
          node-version: 22
      - name: Enforce Red-Test & Frozen-Contract PR Policy
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/pr-red-policy.mjs
