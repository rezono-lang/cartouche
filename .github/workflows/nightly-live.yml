name: Nightly Live Contract Parity (Rezono Core)

# Lesson 4 from Rezono: PRs run in seconds against frozen golden fixtures;
# live cross-repo parity against rezono-lang/rezono runs nightly on 1 runner.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify pinned Rezono contract fixtures & all green checks
        run: |
          cat contracts/rezono-pin.json
          npm run fast-check
      - name: Export Red-Test Board artifact
        run: npm run red-board -- --json > red-board.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cartouche-red-board
          path: red-board.json
          retention-days: 14
