name: Nightly Live Contract Parity (Rezono Core)

# Lesson 4 from Rezono: PRs run in seconds against frozen golden fixtures;
# live cross-repo parity against rezono-lang/rezono runs nightly on 1 runner.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Read pinned Rezono commit from contracts/rezono-pin.json
        id: rezono-pin
        run: |
          PIN=$(node -e "const p = JSON.parse(require('node:fs').readFileSync('contracts/rezono-pin.json','utf8')); console.log(p.pinned_commit);")
          echo "commit=${PIN}" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned Rezono core repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rezono-lang/rezono
          ref: ${{ steps.rezono-pin.outputs.commit }}
          path: .rezono-live
      - name: Verify pinned Rezono source SHA-256 parity
        env:
          CARTOUCHE_PRIVATE_PATTERNS: ${{ secrets.CARTOUCHE_PRIVATE_PATTERNS }}
        run: |
          cat contracts/rezono-pin.json
          node -e "
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const src = JSON.parse(fs.readFileSync('packages/slip/rezono-source.json', 'utf8'));
            for (const [rel, expected] of Object.entries(src.files)) {
              const actual = crypto.createHash('sha256').update(fs.readFileSync('.rezono-live/' + rel)).digest('hex');
              if (actual !== expected) throw new Error('Rezono parity mismatch for ' + rel);
            }
            console.log('Verified all pinned Rezono source files against .rezono-live checkout.');
          "
          npm run fast-check
      - name: Export Red-Test Board artifact
        run: npm run red-board -- --json > red-board.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cartouche-red-board
          path: red-board.json
          retention-days: 14
